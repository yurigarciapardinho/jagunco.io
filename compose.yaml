services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jagunco
      MYSQL_USER: jagunco
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_ID: jagunco-standalone
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      DATABASE_URL: mysql://jagunco:${MYSQL_PASSWORD}@db:3306/jagunco
    expose:
      - "3000"
    volumes:
      # Protocol build pin and the loopback-only admin token. Social data lives in MySQL.
      - game-data:/app/server/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data/caddy
      - caddy-config:/config/caddy
    depends_on:
      - app

volumes:
  game-data:
  mysql-data:
  caddy-data:
  caddy-config:
