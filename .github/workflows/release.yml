name: Publicar candidata
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Número da candidata (1, 2, ...)
        default: '1'
        required: true
        type: string
permissions: {}
concurrency:
  group: publish-game
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      checks: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Publicar imagem por revisão aprovada
        id: image
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: python3 scripts/publish-image.py --component game --candidate "$CANDIDATE"
      - name: Atestar origem da imagem
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
      - name: Baixar e verificar imagem e assinatura
        run: python3 scripts/publish-image.py --verify-manifest "$RUNNER_TEMP/jagunco-release/game-manifest.json" --signed
      - name: Publicar evidências da candidata
        env:
          TAG: ${{ steps.image.outputs.candidate }}
        run: |
          cd "$RUNNER_TEMP/jagunco-release"
          sha256sum *.json > SHA256SUMS
          gh release create "$TAG" *.json SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Jagunco $TAG" --notes-file "$GITHUB_WORKSPACE/docs/RELEASE_NOTES.md"
