services:
  app:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.5
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    stop_grace_period: 15s
  migrate:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
  db:
    pids_limit: 256
    mem_limit: 640m
    cpus: 1.2
    security_opt: [no-new-privileges:true]
  caddy:
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
